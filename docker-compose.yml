services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vidpalai
      POSTGRES_PASSWORD: vidpalai_secure_2025
      POSTGRES_DB: vidpalai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidpalai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    ports:
      - "6380:6379"

  api:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 api.app:app
    ports:
      - "5000:5000"
    volumes:
      - ./gcp-key-new.json:/app/gcp-key.json:ro
      - ./input:/app/data
      - ./.cache:/app/.cache
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  whisper-service:
    build: ./whisper_service
    ports:
      - "8000:8000"
    volumes:
      # Mount GCP credentials for GCS access
      - ./gcp-key-new.json:/app/gcp-key.json:ro 
      - ./input:/app/data
      # Persist HuggingFace cache to avoid re-downloading models on restart
      - ./models_cache:/root/.cache/huggingface 
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    deploy:
      resources:
        reservations:
          devices:
            - count: 1
              capabilities: [gpu]

  worker:
    build: .
    command: celery -A api.worker.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - ./gcp-key-new.json:/app/gcp-key.json:ro
      - ./input:/app/data
      - ./.cache:/app/.cache
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      - WHISPER_SERVICE_URL=http://whisper-service:8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      whisper-service:
        condition: service_started

volumes:
  postgres_data:
